; Visitor - Waveshare ESP32-S3-Touch-AMOLED-1.8 V2
; Board config is VERIFIED GROUND TRUTH - do not modify without hardware confirmation.

[env:visitor]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
; The FACTORY partition size, not the chip size - so an app that outgrows its
; partition fails the build instead of failing the flash.
board_upload.maximum_size = 4194304
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_visitor.csv
; The partition is LABELLED "spiffs" but the image is LittleFS. Pinned so a
; toolchain default cannot silently change the format under the voice pack -
; the symptom is a clean build that boots to "no filesystem".
board_build.filesystem = littlefs

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -O2

lib_deps =
    moononournation/GFX Library for Arduino@1.6.7
    lvgl/lvgl@8.3.11

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
